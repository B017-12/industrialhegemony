<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valmet SpatialSense | Semantic 3D Boiler Room & Autonomous Field Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/",
          "three/examples/jsm/": "/node_modules/three/examples/jsm/",
          "three/addons/postprocessing/Pass.js": "/node_modules/three/examples/jsm/postprocessing/Pass.js",
          "three/examples/jsm/controls/OrbitControls.js": "/node_modules/three/examples/jsm/controls/OrbitControls.js",
          "three/examples/jsm/loaders/PLYLoader.js": "/node_modules/three/examples/jsm/loaders/PLYLoader.js",
          "@sparkjsdev/spark": "/node_modules/@sparkjsdev/spark/dist/spark.module.js",
          "lucide-react": "https://esm.sh/lucide-react@0.460.0?deps=react@18.3.1"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Inter,sans-serif;font-size:13px;color:#4b5662;background:#e9ecef;gap:10px;">
        <div>Loading Valmet DNA SpatialSense (3DGS + CV)...</div>
      </div>
    </div>

    <script type="module">
      async function bootApp() {
        const files = [
          '/src/ui/status.js',
          '/src/data/valmetDataset.js',
          '/src/data/challengeBriefMissions.js',
          '/src/utils/dataPipeline.js',
          '/src/utils/cvEngine.js',
          '/src/utils/pathfinding.js',
          '/src/utils/exerciseEngine.js',
          '/src/utils/copilotEngine.js',
          '/src/components/FloorMinimap.jsx',
          '/src/components/CvReviewPanel.jsx',
          '/src/components/BoilerRoomViewport.jsx',
          '/src/components/AssetInspectorPanel.jsx',
          '/src/components/EdgeCopilotAndArHud.jsx',
          '/src/App.jsx'
        ];

        const blobUrls = {};

        for (const file of files) {
          let code = await fetch(file).then((r) => r.text());
          for (const [origPath, bUrl] of Object.entries(blobUrls)) {
            const baseName = origPath.split('/').pop().replace(/\.(jsx|js)$/, '');
            const regex = new RegExp(`(['"])(\\.\\.?\\/[\\w\\/.-]*\\/${baseName}|\\.\\/${baseName})(\\.(jsx|js))?\\1`, 'g');
            code = code.replace(regex, `"${bUrl}"`);
          }
          const transpiled = window.Babel.transform(code, {
            presets: ['react'],
            filename: file
          }).code;
          const blob = new Blob([transpiled], { type: 'application/javascript' });
          blobUrls[file] = URL.createObjectURL(blob);
        }

        const React = (await import('react')).default;
        const ReactDOM = (await import('react-dom/client')).default;
        const AppModule = await import(blobUrls['/src/App.jsx']);
        const App = AppModule.default;

        ReactDOM.createRoot(document.getElementById('root')).render(
          React.createElement(App)
        );
      }

      bootApp().catch((err) => {
        console.error('Boot error:', err);
        document.getElementById('root').innerHTML = `<pre style="color:#f87171;padding:24px;">${err.stack || err.message}</pre>`;
      });
    </script>
  </body>
</html>
